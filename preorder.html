<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Order | Rayong Direct</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="top">🇹🇭 Rayong → 🇲🇲 Myanmar · Pre-Order</div>
<nav><a class="brand" href="index.html"><img src="assets/rayong-direct.jpg"><b>Rayong Direct</b></a><a class="btn" href="index.html">← ပင်မစာမျက်နှာ</a></nav></header>
<main class="formwrap">
<h1>🛒 Pre-Order မှာယူရန်</h1>
<p>အောက်ပါအချက်အလက်များကို ဖြည့်ပြီး မှာယူမှုတင်ပါ။</p><div class="quickcontact">📱 <a href="tel:+66660460200">+66 6604 60200</a> · 💚 <a href="https://line.me/R/ti/p/~60460200">LINE 60460200</a> · 💬 <a href="https://www.facebook.com/share/1MH38YdDNH/" target="_blank">Facebook</a></div>
<form id="orderForm">
<label>အမည် *<input required name="name" placeholder="သင့်အမည်"></label>
<label>ဖုန်းနံပါတ် *<input required name="phone" placeholder="09xxxxxxxxx"></label>
<label>မြို့ / ပို့ဆောင်မည့်နေရာ *<input required name="city" placeholder="ဥပမာ - ရန်ကုန်"></label>
<label>မှာယူလိုသောပစ္စည်း *<textarea required name="product" placeholder="ပစ္စည်းအမည် / Link / Screenshot အကြောင်းအရာ"></textarea></label>
<label>အရေအတွက် *<input required name="qty" type="number" min="1" value="1"></label>
<label>မှတ်ချက်<textarea name="note" placeholder="အရောင်၊ အရွယ်အစား စသည်"></textarea></label>
<button class="bigbtn" type="submit">မှာယူမှုတင်မည်</button>
<p id="result" class="result"></p>
</form>
</main>
<script>
document.getElementById('orderForm').addEventListener('submit',e=>{
 e.preventDefault();
 const d=new FormData(e.target);
 const msg=`Rayong Direct Pre-Order%0Aအမည်: ${d.get('name')}%0Aဖုန်း: ${d.get('phone')}%0Aမြို့: ${d.get('city')}%0Aပစ္စည်း: ${d.get('product')}%0Aအရေအတွက်: ${d.get('qty')}%0Aမှတ်ချက်: ${d.get('note')||'-'}`;
 document.getElementById('result').innerHTML=`မှာယူမှုအချက်အလက် ပြင်ဆင်ပြီးပါပြီ။ <a href="https://wa.me/?text=${msg}">WhatsApp ဖြင့် ပို့ရန်</a> (နောက်ပိုင်းတွင် သင့် Messenger/Viber နံပါတ်နဲ့ ချိတ်နိုင်ပါတယ်)`;
});
</script></body></html>
